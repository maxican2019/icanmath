name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Unit test dan build debug
        run: gradle testDebugUnitTest assembleDebug

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk matematika-ceria-debug.apk

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v6
        with:
          name: matematika-ceria-debug-apk
          path: matematika-ceria-debug.apk
          if-no-files-found: error

      - name: Lampirkan APK ke GitHub Releases (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: matematika-ceria-debug.apk
